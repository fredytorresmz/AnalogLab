<svg xmlns="http://www.w3.org/2000/svg" width="920" height="455" viewBox="0 0 920 455" role="img" aria-label="Diagrama funcional de motor DC con MOSFET N de lado bajo, GPIO por resistencia a puerta, resistencia pulldown, motor entre 12 voltios y drenador, diodo flyback en antiparalelo con motor, tierra compartida">
<style>text{font-family:Arial,sans-serif;fill:#1c344b}.h{font-size:22px;font-weight:bold}.t{font-size:18px}.s{font-size:16px}.wire{fill:none;stroke:#283e59;stroke-width:3;stroke-linejoin:round}.res{fill:white;stroke:#283e59;stroke-width:3}</style><rect width="920" height="455" rx="18" fill="#f8fbff"/><text x="34" y="40" class="h">Control de motor con MOSFET · lado bajo</text><text x="34" y="67" class="s">Dibujo pedagógico de conexiones; comprueba patillaje, protección y límites del componente real.</text>
<!-- GPIO, gate resistor --> <rect x="46" y="205" width="175" height="82" rx="12" fill="#e7f3ff" stroke="#3a8ccd" stroke-width="3"/><text x="133" y="237" text-anchor="middle" class="h">Controlador</text><text x="133" y="262" text-anchor="middle" class="t">GPIO 3,3/5 V</text><path class="wire" d="M221 245H300"/><rect x="300" y="225" width="80" height="40" rx="6" class="res"/><text x="340" y="250" text-anchor="middle" class="t">RG</text><path class="wire" d="M380 245H548"/><circle cx="475" cy="245" r="5" fill="#283e59"/>
<!-- pulldown --> <path class="wire" d="M475 245V294"/><rect x="455" y="294" width="40" height="53" rx="5" class="res"/><text x="508" y="323" class="s">RPD</text><path class="wire" d="M475 347V382"/>
<!-- switch block with clearly identified ports --> <rect x="548" y="192" width="145" height="122" rx="12" fill="#e9f7f0" stroke="#3a936e" stroke-width="3"/><text x="620" y="225" text-anchor="middle" class="h">Q1 NMOS</text><text x="620" y="254" text-anchor="middle" class="t">Interruptor</text><text x="563" y="280" class="s">G</text><text x="620" y="185" text-anchor="middle" class="s">D</text><text x="621" y="333" text-anchor="middle" class="s">S</text>
<path class="wire" d="M620 192V176 M620 314V382"/>
<!-- motor between V+ and drain --> <path class="wire" d="M620 85V120"/><circle cx="620" cy="145" r="25" fill="white" stroke="#3a8ccd" stroke-width="3"/><text x="620" y="152" text-anchor="middle" class="h">M</text><path class="wire" d="M620 170V176"/><text x="630" y="82" class="t">+V motor (ej. 12 V)</text>
<!-- flyback diode: cathode at top and anode at bottom --> <path class="wire" d="M620 85H760V116 M760 160V176H620"/><path d="M742 120H778" stroke="#cc563c" stroke-width="4"/><path d="M744 157L760 124L776 157Z" fill="white" stroke="#cc563c" stroke-width="3"/><text x="786" y="138" class="s">Dfly</text><text x="786" y="158" class="s">cátodo ↑</text>
<!-- shared ground --> <path class="wire" d="M133 287V382H620 M475 382H620 M133 382V397 M475 382V397 M620 382V397"/><path class="wire" d="M115 397H151 M122 405H144 M127 413H139 M457 397H493 M464 405H486 M469 413H481 M602 397H638 M609 405H631 M614 413H626"/>
<text x="274" y="433" class="s">Tierra común para control y potencia · la protección se selecciona para cada motor</text></svg>