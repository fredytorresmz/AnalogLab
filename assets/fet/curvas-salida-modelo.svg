<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 410" role="img" aria-labelledby="ttl desc">
<title id="ttl">Curvas de salida idealizadas para MOSFET de canal N</title>
<desc id="desc">Corriente de drenador frente a tensión drenador fuente, para sobrevoltajes de puerta de 1, 2 y 3 voltios. La región triodo es curva hasta VDS igual a Vov y luego la corriente se mantiene constante en el modelo.</desc>
<rect x="0" y="0" width="820" height="410" rx="15" fill="#fbfdff"/>
<text x="35" y="32" font-family="sans-serif" font-size="20" font-weight="700" fill="#183450">Característica de salida MOSFET N · modelo ideal</text>
<text x="35" y="53" font-family="sans-serif" font-size="13" fill="#52687e">ID = k(2·Vov·VDS − VDS²) en triodo; ID = k·Vov² en saturación · k=1 mA/V²</text>
