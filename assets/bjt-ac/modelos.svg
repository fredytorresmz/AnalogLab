<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="Modelo re y modelo híbrido pi"><style>text{font:16px Arial, sans-serif;fill:#18304b}.heading{font:bold 21px Arial;fill:#18304b}.label{font:bold 17px Arial;fill:#174d83}.wire{stroke:#26384b;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.res{stroke:#26384b;stroke-width:3;fill:#fff}.cap{stroke:#26384b;stroke-width:4}.node{fill:#26384b}.bjt{stroke:#155aa8;stroke-width:3.5;fill:none;stroke-linejoin:round}.arrow{fill:#155aa8}.muted{fill:#627387}.soft{fill:#f2f7fc;stroke:#dce5ef;stroke-width:1.5}</style><rect width="960" height="520" rx="18" fill="#fff"/>
<text x="34" y="42" class="heading">Dos modelos, una misma física de pequeña señal</text><text x="34" y="68" class="muted">Ambos son linealizaciones alrededor del mismo punto de polarización Q.</text>
<rect x="40" y="104" width="414" height="310" rx="16" class="soft"/><text x="62" y="146" class="label">Modelo de resistencia dinámica re</text>
<text x="62" y="191">re ≈ 26 mV / IEQ</text><text x="62" y="233">Corriente de salida ≈ α · ie</text><text x="62" y="275">Muy útil para calcular Av</text><text x="62" y="310">en configuraciones de aula.</text><text x="62" y="369" class="muted">IEQ se obtiene del análisis DC.</text>
<rect x="502" y="104" width="414" height="310" rx="16" class="soft"/><text x="524" y="146" class="label">Modelo híbrido-π (híbrido pi)</text>
<text x="524" y="191">gm ≈ ICQ / VT</text><text x="524" y="233">rπ = βac / gm</text><text x="524" y="275">Corriente de salida ≈ gm · vπ</text><text x="524" y="310">Práctico para análisis nodal</text><text x="524" y="346">y etapas con carga.</text>
<rect x="40" y="438" width="876" height="50" rx="10" fill="#f0faf4" stroke="#8fcdb0" stroke-width="1.5"/><text x="478" y="470" text-anchor="middle" class="label">Relación aproximada: rπ ≈ (βac + 1) · re   y   gm ≈ 1 / re   cuando α ≈ 1</text></svg>