<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="Ruta de AC de banda media"><style>text{font:16px Arial, sans-serif;fill:#18304b}.heading{font:bold 21px Arial;fill:#18304b}.label{font:bold 17px Arial;fill:#174d83}.wire{stroke:#26384b;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.res{stroke:#26384b;stroke-width:3;fill:#fff}.cap{stroke:#26384b;stroke-width:4}.node{fill:#26384b}.bjt{stroke:#155aa8;stroke-width:3.5;fill:none;stroke-linejoin:round}.arrow{fill:#155aa8}.muted{fill:#627387}.soft{fill:#f2f7fc;stroke:#dce5ef;stroke-width:1.5}</style><rect width="960" height="480" rx="18" fill="#fff"/>
<text x="36" y="42" class="heading">Cómo obtener el equivalente de pequeña señal</text><text x="36" y="74" class="muted">Este es un mapa de transformación, no un circuito eléctrico.</text>
<g><rect x="36" y="120" width="268" height="190" rx="16" class="soft"/><text x="56" y="154" class="label">1. Resolver DC</text><text x="56" y="191">Capacitores → abiertos</text><text x="56" y="225">Calcular IEQ e ICQ</text><text x="56" y="258">Confirmar región activa</text><text x="56" y="293" class="muted">El punto Q queda establecido</text></g>
<path d="M320 215 H344" stroke="#155aa8" stroke-width="4"/><path d="M343 206 L361 215 L343 224" fill="none" stroke="#155aa8" stroke-width="4"/>
<g><rect x="364" y="120" width="268" height="190" rx="16" class="soft"/><text x="384" y="154" class="label">2. Obtener AC</text><text x="384" y="191">VCC → tierra de AC</text><text x="384" y="225">C1, C2, CE → cortos*</text><text x="384" y="258">Conservar RC, RL y RE</text><text x="384" y="293" class="muted">*Aproximación de banda media</text></g>
<path d="M648 215 H672" stroke="#155aa8" stroke-width="4"/><path d="M670 206 L688 215 L670 224" fill="none" stroke="#155aa8" stroke-width="4"/>
<g><rect x="692" y="120" width="230" height="190" rx="16" class="soft"/><text x="712" y="154" class="label">3. Modelo del BJT</text><text x="712" y="191">re = VT / IEQ</text><text x="712" y="225">O usar rπ y gm</text><text x="712" y="258">Calcular Zi, Zo, Av</text><text x="712" y="293" class="muted">Interpretar signo y carga</text></g>
<rect x="36" y="352" width="886" height="92" rx="14" fill="#fff7e9" stroke="#e7bc6c" stroke-width="2"/><text x="60" y="385" class="label">Advertencia fundamental</text><text x="60" y="413">Una fuente independiente de corriente DC se abre; una fuente de señal AC no se elimina.</text></svg>