<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-label="Diagnóstico y Troubleshooting de Laboratorio">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .card-border { fill: none; stroke: #d9e2ec; stroke-width: 1.5; }
      .title { font: bold 19px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #102a43; }
      .subtitle { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #627d98; }
      .wire { stroke: #243b53; stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .res { fill: #ffffff; stroke: #102a43; stroke-width: 2.4; }
      .cap { stroke: #0b69a3; stroke-width: 3.5; }
      .node { fill: #102a43; }
      .trans-circle { fill: #f0f4f8; stroke: #9fb3c8; stroke-width: 1.8; }
      .trans-line { stroke: #0b69a3; stroke-width: 3; stroke-linecap: round; }
      .trans-arrow { fill: #0b69a3; }
      .lbl { font: bold 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; fill: #0b69a3; }
      .val { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #334e68; }
      .gnd { stroke: #243b53; stroke-width: 2.4; stroke-linecap: round; }
      .tp-badge { fill: #ffedd5; stroke: #ea580c; stroke-width: 1.8; rx: 4px; }
      .tp-text { font: bold 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; fill: #c2410c; }
      .box-panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 8px; }
      .table-hdr { font: bold 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #1e293b; }
      .table-row { font: 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #334155; }
      .probe-line { stroke: #ea580c; stroke-width: 2; stroke-dasharray: 4,3; fill: none; }
    </style>
  </defs>

  <rect width="920" height="520" rx="14" class="bg"/>
  <rect x="15" y="15" width="890" height="490" rx="10" class="card-border"/>

  <text x="35" y="48" class="title">Protocolo de Diagnóstico y Búsqueda de Fallas en Laboratorio</text>
  <text x="35" y="70" class="subtitle">Identificación de anomalías mediante Puntos de Prueba (TP), multímetro digital y osciloscopio</text>

  <!-- CIRCUITO CON PUNTOS DE PRUEBA (IZQUIERDA) -->
  <!-- TP1: VCC -->
  <path class="wire" d="M120 100 H230 M230 100 H300"/>
  <circle cx="300" cy="100" r="4.5" class="node"/>
  <text x="310" y="105" class="lbl">+VCC = 15V</text>
  <rect x="235" y="75" width="38" height="20" class="tp-badge"/>
  <text x="242" y="90" class="tp-text">TP1</text>

  <!-- Rama Divisor Base -->
  <path class="wire" d="M120 100 V130"/>
  <rect x="107" y="130" width="26" height="50" class="res"/>
  <text x="75" y="158" class="lbl">R1</text>
  <path class="wire" d="M120 180 V230"/>
  <circle cx="120" cy="230" r="4.5" class="node"/>

  <!-- TP2: BASE -->
  <rect x="55" y="218" width="38" height="20" class="tp-badge"/>
  <text x="62" y="233" class="tp-text">TP2</text>
  <line x1="93" y1="228" x2="120" y2="228" class="probe-line"/>

  <path class="wire" d="M120 230 V270"/>
  <rect x="107" y="270" width="26" height="50" class="res"/>
  <text x="75" y="300" class="lbl">R2</text>
  <path class="wire" d="M120 320 V365"/>
  <line x1="105" y1="365" x2="135" y2="365" class="gnd"/>

  <!-- Entrada AC con C1 -->
  <path class="wire" d="M30 230 H70"/>
  <line x1="70" y1="218" x2="70" y2="242" class="cap"/>
  <line x1="77" y1="218" x2="77" y2="242" class="cap"/>
  <path class="wire" d="M77 230 H120"/>

  <!-- Transistor Q1 NPN -->
  <path class="wire" d="M120 230 H165"/>
  <circle cx="185" cy="230" r="32" class="trans-circle"/>
  <path class="trans-line" d="M170 212 V248"/>
  <path class="trans-line" d="M170 218 L200 196"/>
  <path class="wire" d="M200 196 V180"/>
  <path class="trans-line" d="M170 242 L200 264"/>
  <polygon points="191,257 202,266 188,266" class="trans-arrow"/>
  <text x="195" y="232" class="lbl">Q1</text>

  <!-- RC en Colector y TP3 -->
  <path class="wire" d="M200 100 V130"/>
  <rect x="187" y="130" width="26" height="50" class="res"/>
  <text x="220" y="158" class="lbl">RC</text>
  <circle cx="200" cy="188" r="4.5" class="node"/>
  <!-- TP3: COLECTOR -->
  <rect x="235" y="178" width="38" height="20" class="tp-badge"/>
  <text x="242" y="193" class="tp-text">TP3</text>
  <line x1="200" y1="188" x2="235" y2="188" class="probe-line"/>

  <!-- Salida hacia C2 -->
  <path class="wire" d="M200 188 H285"/>
  <line x1="285" y1="176" x2="285" y2="200" class="cap"/>
  <line x1="292" y1="176" x2="292" y2="200" class="cap"/>
  <path class="wire" d="M292 188 H320"/>
  <circle cx="320" cy="188" r="4.5" class="node"/>
  <!-- TP5: SALIDA OSCILOSCOPIO -->
  <rect x="330" y="178" width="38" height="20" class="tp-badge"/>
  <text x="337" y="193" class="tp-text">TP5</text>
  <text x="375" y="193" font-size="11" font-weight="bold" fill="#0284c7">Osciloscopio</text>

  <!-- Emisor con RE, CE y TP4 -->
  <path class="wire" d="M200 264 V285"/>
  <circle cx="200" cy="285" r="4.5" class="node"/>
  <!-- TP4: EMISOR -->
  <rect x="235" y="275" width="38" height="20" class="tp-badge"/>
  <text x="242" y="290" class="tp-text">TP4</text>
  <line x1="200" y1="285" x2="235" y2="285" class="probe-line"/>

  <!-- RE y CE -->
  <path class="wire" d="M200 285 V310"/>
  <rect x="187" y="310" width="26" height="50" class="res"/>
  <text x="155" y="338" class="lbl">RE</text>
  <path class="wire" d="M200 360 V385"/>

  <!-- CE en paralelo -->
  <path class="wire" d="M200 285 H260 V325"/>
  <line x1="250" y1="325" x2="270" y2="325" class="cap"/>
  <line x1="250" y1="333" x2="270" y2="333" class="cap"/>
  <path class="wire" d="M260 333 V385 H200"/>
  <circle cx="200" cy="385" r="4.5" class="node"/>
  <path class="wire" d="M200 385 V405"/>
  <line x1="185" y1="405" x2="215" y2="405" class="gnd"/>

  <!-- PANEL DERECHO: MATRIZ DE DIAGNÓSTICO EN LABORATORIO -->
  <rect x="420" y="90" width="465" height="305" class="box-panel"/>
  <text x="435" y="116" font-size="14.5" font-weight="bold" fill="#102a43">Matriz Maestra de Diagnóstico de Fallas (Boylestad Cap. 5.21)</text>

  <!-- Cabecera de tabla -->
  <rect x="435" y="128" width="435" height="24" rx="4" fill="#e2e8f0"/>
  <text x="442" y="144" class="table-hdr">Falla Inyectada</text>
  <text x="545" y="144" class="table-hdr">TP2 (Base)</text>
  <text x="615" y="144" class="table-hdr">TP3 (Colector)</text>
  <text x="705" y="144" class="table-hdr">TP4 (Emisor)</text>
  <text x="785" y="144" class="table-hdr">Firma en TP5</text>

  <!-- Fila 1: R1 Abierta -->
  <rect x="435" y="156" width="435" height="34" fill="#ffffff" stroke="#f1f5f9"/>
  <text x="442" y="172" class="table-row" font-weight="bold" fill="#dc2626">R1 Abierta</text>
  <text x="442" y="184" font-size="10" class="val">Sin bias superior</text>
  <text x="545" y="176" class="table-row">0 V</text>
  <text x="615" y="176" class="table-row">15 V (VCC)</text>
  <text x="705" y="176" class="table-row">0 V</text>
  <text x="785" y="176" class="table-row" fill="#dc2626">Silencio (0V)</text>

  <!-- Fila 2: R2 Abierta -->
  <rect x="435" y="193" width="435" height="34" fill="#f8fafc" stroke="#f1f5f9"/>
  <text x="442" y="209" class="table-row" font-weight="bold" fill="#dc2626">R2 Abierta</text>
  <text x="442" y="221" font-size="10" class="val">Base flota a VCC</text>
  <text x="545" y="213" class="table-row">Muy alto</text>
  <text x="615" y="213" class="table-row">Bajo (Vsat)</text>
  <text x="705" y="213" class="table-row">Muy alto</text>
  <text x="785" y="213" class="table-row" fill="#dc2626">Distorsión brutal</text>

  <!-- Fila 3: RE Abierta -->
  <rect x="435" y="230" width="435" height="34" fill="#ffffff" stroke="#f1f5f9"/>
  <text x="442" y="246" class="table-row" font-weight="bold" fill="#dc2626">RE Abierta</text>
  <text x="442" y="258" font-size="10" class="val">Pata emisor suelta</text>
  <text x="545" y="250" class="table-row">Nominal</text>
  <text x="615" y="250" class="table-row">15 V (VCC)</text>
  <text x="705" y="250" class="table-row">VB - 0.7V</text>
  <text x="785" y="250" class="table-row" fill="#dc2626">Sin amplificación</text>

  <!-- Fila 4: CE Abierto -->
  <rect x="435" y="267" width="435" height="34" fill="#f8fafc" stroke="#f1f5f9"/>
  <text x="442" y="283" class="table-row" font-weight="bold" fill="#d97706">CE Abierto</text>
  <text x="442" y="295" font-size="10" class="val">Capacitor seco/desol</text>
  <text x="545" y="287" class="table-row">Nominal</text>
  <text x="615" y="287" class="table-row">Nominal</text>
  <text x="705" y="287" class="table-row">Nominal</text>
  <text x="785" y="287" class="table-row" fill="#d97706">Ganancia cae 95%</text>

  <!-- Fila 5: R2 Código de Color Erróneo (RETO-03) -->
  <rect x="435" y="304" width="435" height="42" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="442" y="320" class="table-row" font-weight="bold" fill="#c2410c">R2 desvalorizada</text>
  <text x="442" y="334" font-size="10" class="val">Pusieron 3.3k en vez de 10k</text>
  <text x="545" y="325" class="table-row">1.1 V (Bajo)</text>
  <text x="615" y="325" class="table-row">13.8 V</text>
  <text x="705" y="325" class="table-row">0.4 V</text>
  <text x="785" y="325" class="table-row" font-weight="bold" fill="#c2410c">Corte en cresta</text>

  <!-- Leyenda de puntas -->
  <rect x="435" y="352" width="435" height="35" rx="4" fill="#f1f5f9"/>
  <text x="445" y="372" font-size="11" class="val"><b>Punta Osciloscopio:</b> Use siempre escala 10X para no sobrecargar el colector con los 15 pF del cable.</text>

  <!-- FOOTER -->
  <rect x="35" y="415" width="850" height="75" rx="6" fill="#fff7ed" stroke="#ffedd5" stroke-width="1.5"/>
  <text x="50" y="438" font-weight="bold" fill="#9a3412" font-size="13">🛠️ EL MÉTODO SISTEMÁTICO DE LABORATORIO (Profesor Fredy):</text>
  <text x="50" y="458" class="val" style="font-size:12px;">1° Antes de tocar el generador de funciones o el osciloscopio, mida siempre el DC con el multímetro (TP1 a TP4).</text>
  <text x="50" y="476" class="val" style="font-size:12px;">Si el punto Q no está sano (ej. VCE &lt; 0.5V o VCE ≈ VCC), la señal AC jamás saldrá limpia. ¡El 90% de las fallas son de continua!</text>
</svg>
