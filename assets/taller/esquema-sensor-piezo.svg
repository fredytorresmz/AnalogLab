<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-label="Acondicionamiento de Sensor Piezoeléctrico y Límite de Pequeña Señal">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .card-border { fill: none; stroke: #d9e2ec; stroke-width: 1.5; }
      .title { font: bold 19px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #102a43; }
      .subtitle { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #627d98; }
      .wire { stroke: #243b53; stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .res { fill: #ffffff; stroke: #102a43; stroke-width: 2.4; }
      .cap { stroke: #0b69a3; stroke-width: 3.5; }
      .node { fill: #102a43; }
      .trans-circle { fill: #f0f4f8; stroke: #9fb3c8; stroke-width: 1.8; }
      .trans-line { stroke: #0b69a3; stroke-width: 3; stroke-linecap: round; }
      .trans-arrow { fill: #0b69a3; }
      .lbl { font: bold 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; fill: #0b69a3; }
      .val { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #334e68; }
      .gnd { stroke: #243b53; stroke-width: 2.4; stroke-linecap: round; }
      .box-panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 8px; }
      .ac-source { fill: #f0f4f8; stroke: #243b53; stroke-width: 2.4; }
      .sine-wave { stroke: #0b69a3; stroke-width: 2.2; fill: none; }
      .sine-dist { stroke: #d9381e; stroke-width: 2.2; fill: none; }
    </style>
  </defs>

  <rect width="920" height="520" rx="14" class="bg"/>
  <rect x="15" y="15" width="890" height="490" rx="10" class="card-border"/>

  <text x="35" y="48" class="title">Acondicionamiento de Sensor Piezoeléctrico &amp; Criterio de Pequeña Señal</text>
  <text x="35" y="70" class="subtitle">Control de distorsión armónica (HD2 ≤ 5%) mediante degeneración de emisor (Swamping)</text>

  <!-- ESQUEMA CIRCUITAL (IZQUIERDA) -->
  <!-- Sensor Piezoeléctrico Modelo -->
  <rect x="35" y="130" width="160" height="230" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-dasharray="4,4" stroke-width="1.5"/>
  <text x="45" y="150" font-size="11" font-weight="bold" fill="#0284c7">SENSOR PIEZOELÉCTRICO</text>

  <!-- Fuente vs -->
  <circle cx="80" cy="235" r="22" class="ac-source"/>
  <path d="M 68 235 Q 74 225 80 235 Q 86 245 92 235" class="sine-wave"/>
  <text x="50" y="275" class="lbl" style="font-size:12px;">vs (40 mVp)</text>
  <path class="wire" d="M80 257 V330"/>
  <line x1="65" y1="330" x2="95" y2="330" class="gnd"/>

  <!-- Resistencia Rs del sensor -->
  <path class="wire" d="M80 213 V185 H110"/>
  <rect x="110" y="172" width="45" height="26" class="res"/>
  <text x="120" y="163" class="lbl">Rs</text>
  <text x="115" y="213" class="val">1.2 kΩ</text>
  <path class="wire" d="M155 185 H195"/>

  <!-- Condensador C1 -->
  <path class="wire" d="M195 185 H220"/>
  <line x1="220" y1="172" x2="220" y2="198" class="cap"/>
  <line x1="228" y1="172" x2="228" y2="198" class="cap"/>
  <text x="215" y="163" class="lbl">C1</text>
  <path class="wire" d="M228 185 H270"/>

  <!-- Divisor R1 y R2 -->
  <circle cx="270" cy="185" r="4.5" class="node"/>
  <path class="wire" d="M270 185 V125 M270 185 V245"/>
  <rect x="257" y="125" width="26" height="40" class="res"/>
  <text x="225" y="145" class="lbl">R1</text>
  <path class="wire" d="M270 125 V95 H360"/>
  <circle cx="360" cy="95" r="4.5" class="node"/>
  <text x="370" y="100" class="lbl">+VCC</text>

  <rect x="257" y="245" width="26" height="40" class="res"/>
  <text x="225" y="265" class="lbl">R2</text>
  <path class="wire" d="M270 285 V330"/>
  <line x1="255" y1="330" x2="285" y2="330" class="gnd"/>

  <!-- Transistor Q1 NPN -->
  <path class="wire" d="M270 185 H320"/>
  <circle cx="340" cy="185" r="32" class="trans-circle"/>
  <path class="trans-line" d="M325 168 V202"/>
  <path class="trans-line" d="M325 174 L355 152"/>
  <path class="wire" d="M355 152 V95"/>
  <path class="trans-line" d="M325 196 L355 218"/>
  <polygon points="346,211 357,220 343,220" class="trans-arrow"/>
  <text x="355" y="185" class="lbl">Q1</text>

  <!-- RC en Colector -->
  <rect x="342" y="105" width="26" height="38" class="res"/>
  <text x="375" y="125" class="lbl">RC</text>

  <!-- Emisor con Swamping RE1 y Bypass en RE2 -->
  <path class="wire" d="M355 218 V240"/>
  <circle cx="355" cy="240" r="4" class="node"/>
  <!-- RE1 no puenteada -->
  <rect x="342" y="245" width="26" height="38" class="res" style="stroke:#d9381e; stroke-width:2.6;"/>
  <text x="280" y="265" font-weight="bold" fill="#d9381e" font-size="12">RE1 (Swamp)</text>
  <text x="375" y="265" class="val">180 Ω</text>
  <path class="wire" d="M355 283 V305"/>
  <circle cx="355" cy="305" r="4.5" class="node"/>

  <!-- RE2 y CE en paralelo -->
  <path class="wire" d="M355 305 H410 V325"/>
  <rect x="342" y="325" width="26" height="38" class="res"/>
  <text x="310" y="345" class="lbl">RE2</text>
  <path class="wire" d="M355 305 V325 M355 363 V385"/>

  <!-- CE bypass -->
  <line x1="400" y1="335" x2="420" y2="335" class="cap"/>
  <line x1="400" y1="343" x2="420" y2="343" class="cap"/>
  <text x="428" y="342" class="lbl">CE</text>
  <path class="wire" d="M410 343 V385 H355"/>
  <circle cx="355" cy="385" r="4.5" class="node"/>
  <path class="wire" d="M355 385 V405"/>
  <line x1="340" y1="405" x2="370" y2="405" class="gnd"/>

  <!-- PANEL DERECHO: COMPARACIÓN DE FORMAS DE ONDA Y DISTORSIÓN -->
  <rect x="470" y="90" width="415" height="305" class="box-panel"/>
  <text x="485" y="118" font-size="15" font-weight="bold" fill="#102a43">Criterio Matemático de Linealidad vs Deformación</text>

  <!-- CASO 1: SIN SWAMPING (DISTORSIÓN SEVERA) -->
  <rect x="485" y="135" width="385" height="110" rx="6" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.2"/>
  <text x="495" y="155" font-size="12.5" font-weight="bold" fill="#be123c">❌ Caso A: Sin degeneración (RE1 = 0, vbe = 40 mVp)</text>
  <text x="495" y="173" class="val" style="font-size:12px;">Distorsión armónica de segundo orden: <b>HD2 = Vp / (4·VT)</b></text>
  <text x="495" y="191" class="val" style="font-size:12px;">HD2 = 40 mV / (4 × 26 mV) = 40 / 104 = <b>38.46% (¡Inaceptable!)</b></text>
  <text x="495" y="210" class="val" style="font-size:11.5px; fill:#9f1239;">Forma de onda: recorte asimétrico del semiciclo inferior por exponencial.</text>
  <!-- Mini onda deformada -->
  <path d="M 750 230 Q 765 200 780 230 Q 795 242 810 230" class="sine-dist"/>
  <text x="815" y="233" font-size="10" fill="#be123c" font-weight="bold">Deformada</text>

  <!-- CASO 2: CON SWAMPING (ONDA LINEAL PURA) -->
  <rect x="485" y="255" width="385" height="125" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="495" y="275" font-size="12.5" font-weight="bold" fill="#15803d">✅ Caso B: Con Swamping (RE1 = 180 Ω, re = 18 Ω)</text>
  <text x="495" y="295" class="val" style="font-size:12px;">Divisor en la unión: <b>vbe_interna = vi · re / (re + RE1)</b></text>
  <text x="495" y="313" class="val" style="font-size:12px;">vbe = 40 mV × 18 / (18 + 180) = 40 mV × 0.091 = <b>3.64 mV pico</b></text>
  <text x="495" y="331" class="val" style="font-size:12px;">Como vbe = 3.64 mV &lt; 5.2 mV: <b>HD2 = 3.64 / 104 = 3.5% &lt; 5%</b></text>
  <text x="495" y="350" font-size="11.5" font-weight="bold" fill="#15803d">¡Señal de salida perfectamente senoidal e inteligible!</text>
  <!-- Mini onda senoidal limpia -->
  <path d="M 750 365 Q 765 345 780 365 Q 795 385 810 365" class="sine-wave"/>
  <text x="815" y="368" font-size="10" fill="#15803d" font-weight="bold">Limpia</text>

  <!-- FOOTER -->
  <rect x="35" y="415" width="850" height="75" rx="6" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="50" y="438" font-weight="bold" fill="#0369a1" font-size="13">💡 LA ANALOGÍA DEL PLANO INCLINADO CURVO (Profesor Fredy &amp; Malvino):</text>
  <text x="50" y="458" class="val" style="font-size:12px;">La curva exponencial de un diodo o BJT parece recta solo si caminas pasitos diminutos (≤ 5 mV). Si das zancadas de 40 mV,</text>
  <text x="50" y="476" class="val" style="font-size:12px;">te estrellas con la curva y la onda se distorsiona. El resistor de swamping RE1 absorbe el 90% de la zancada y salva la señal.</text>
</svg>
