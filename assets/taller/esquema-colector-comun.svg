<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-label="Seguidor de Emisor Colector Común">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font: bold 19px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #102a43; }
      .subtitle { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #627d98; }
      .wire { stroke: #243b53; stroke-width: 2.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .res { fill: #ffffff; stroke: #102a43; stroke-width: 2.5; }
      .cap { stroke: #0b69a3; stroke-width: 3.5; }
      .node { fill: #102a43; }
      .trans-circle { fill: #f0f4f8; stroke: #9fb3c8; stroke-width: 1.8; }
      .trans-line { stroke: #0b69a3; stroke-width: 3; stroke-linecap: round; }
      .trans-arrow { fill: #0b69a3; }
      .lbl { font: bold 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; fill: #0b69a3; }
      .val { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #334e68; }
      .gnd { stroke: #243b53; stroke-width: 2.5; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="900" height="520" rx="14" class="bg"/>
  <rect x="15" y="15" width="870" height="490" rx="10" fill="none" stroke="#d9e2ec" stroke-width="1.5"/>

  <text x="35" y="48" class="title">Esquemático 3 · Colector Común (CC) / Seguidor de Emisor</text>
  <text x="35" y="72" class="subtitle">Buffer de alta impedancia de entrada, muy baja impedancia de salida y ganancia de tensión Av ≈ +1</text>

  <!-- Rail VCC -->
  <path class="wire" d="M380 95 H520 M520 95 H600"/>
  <circle cx="600" cy="95" r="5" class="node"/>
  <text x="612" y="100" class="lbl">+VCC = 12V</text>

  <!-- Divisor R1 y R2 -->
  <path class="wire" d="M380 95 V130"/>
  <rect x="367" y="130" width="26" height="60" class="res"/>
  <text x="310" y="165" class="lbl">R1</text>
  <text x="310" y="182" class="val">100 kΩ</text>

  <path class="wire" d="M380 190 V270 M380 270 V330"/>
  <circle cx="380" cy="270" r="5" class="node"/>

  <rect x="367" y="330" width="26" height="60" class="res"/>
  <text x="310" y="365" class="lbl">R2</text>
  <text x="310" y="382" class="val">100 kΩ</text>
  <path class="wire" d="M380 390 V440"/>

  <!-- Colector conectado directo a VCC (con bypass AC a tierra) -->
  <path class="wire" d="M520 95 V220"/>
  <circle cx="520" cy="150" r="5" class="node"/>
  <!-- Capacitor de desacoplo de fuente a tierra -->
  <path class="wire" d="M520 150 H590 V170 M590 190 V210 H590"/>
  <path class="cap" d="M575 170 H605 M575 190 H605"/>
  <path class="gnd" d="M580 210 H600 M584 215 H596 M588 220 H592"/>
  <text x="615" y="185" class="lbl">Cdec</text>
  <text x="615" y="200" class="val">100 nF</text>

  <!-- Transistor Q1 NPN -->
  <circle cx="480" cy="270" r="48" class="trans-circle"/>
  <path class="trans-line" d="M460 245 V295"/>
  <path class="wire" d="M380 270 H460"/>
  <path class="trans-line" d="M460 255 L520 220"/>
  <path class="trans-line" d="M460 285 L520 325"/>
  <polygon points="505,320 520,325 515,310" class="trans-arrow"/>

  <text x="430" y="335" class="lbl">Q1 · 2N3904</text>
  <text x="430" y="352" class="val">β = 150</text>

  <!-- Resistencia de Emisor RE (No hay RC!) -->
  <path class="wire" d="M520 325 V350"/>
  <circle cx="520" cy="350" r="5" class="node"/>
  <rect x="507" y="350" width="26" height="60" class="res"/>
  <text x="460" y="385" class="lbl">RE</text>
  <text x="450" y="402" class="val">2.2 kΩ</text>
  <path class="wire" d="M520 410 V440"/>

  <!-- Entrada -->
  <path class="cap" d="M225 252 V288 M240 252 V288"/>
  <text x="218" y="242" class="lbl">C1</text>
  <text x="215" y="304" class="val">10 µF</text>
  <path class="wire" d="M150 270 H225 M240 270 H380"/>
  <circle cx="140" cy="270" r="5" fill="#fff" stroke="#0b69a3" stroke-width="2.5"/>
  <text x="95" y="275" class="lbl">vi (in)</text>

  <!-- Salida tomada DIRECTAMENTE DEL EMISOR hacia C2 y RL -->
  <path class="wire" d="M520 350 H670"/>
  <path class="cap" d="M670 332 V368 M685 332 V368"/>
  <text x="665" y="322" class="lbl">C2</text>
  <text x="665" y="384" class="val">47 µF</text>

  <path class="wire" d="M685 350 H770"/>
  <circle cx="770" cy="350" r="5" class="node"/>
  <path class="wire" d="M770 350 H830"/>
  <circle cx="830" cy="350" r="5" fill="#fff" stroke="#0b69a3" stroke-width="2.5"/>
  <text x="842" y="355" class="lbl">vo (out)</text>

  <!-- Carga RL baja -->
  <path class="wire" d="M770 350 V375"/>
  <rect x="757" y="375" width="26" height="45" class="res"/>
  <text x="795" y="400" class="lbl">RL</text>
  <text x="795" y="417" class="val">330 Ω</text>
  <path class="wire" d="M770 420 V440"/>

  <!-- Tierra -->
  <path class="wire" d="M380 440 H770"/>
  <path class="wire" d="M520 440 V460"/>
  <path class="gnd" d="M500 460 H540 M508 467 H532 M516 474 H524"/>
</svg>
