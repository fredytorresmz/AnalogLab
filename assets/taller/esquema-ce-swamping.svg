<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-label="Emisor Común con Resistencia Dividida Swamping">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font: bold 19px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #102a43; }
      .subtitle { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #627d98; }
      .wire { stroke: #243b53; stroke-width: 2.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .res { fill: #ffffff; stroke: #102a43; stroke-width: 2.5; }
      .cap { stroke: #0b69a3; stroke-width: 3.5; }
      .node { fill: #102a43; }
      .trans-circle { fill: #f0f4f8; stroke: #9fb3c8; stroke-width: 1.8; }
      .trans-line { stroke: #0b69a3; stroke-width: 3; stroke-linecap: round; }
      .trans-arrow { fill: #0b69a3; }
      .lbl { font: bold 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; fill: #0b69a3; }
      .val { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #334e68; }
      .gnd { stroke: #243b53; stroke-width: 2.5; stroke-linecap: round; }
      .highlight { fill: #fff8e6; stroke: #f0b429; stroke-dasharray: 4,4; }
    </style>
  </defs>

  <rect width="900" height="540" rx="14" class="bg"/>
  <rect x="15" y="15" width="870" height="510" rx="10" fill="none" stroke="#d9e2ec" stroke-width="1.5"/>

  <text x="35" y="48" class="title">Esquemático 2 · Emisor Común con Degeneración Parcial (Swamping)</text>
  <text x="35" y="72" class="subtitle">Estabilidad de ganancia frente a tolerancias de transistor y reducción de distorsión armónica</text>

  <!-- Rail VCC -->
  <path class="wire" d="M380 95 H520 M520 95 H600"/>
  <circle cx="600" cy="95" r="5" class="node"/>
  <text x="612" y="100" class="lbl">+VCC = 15V</text>

  <!-- Divisor R1 y R2 -->
  <path class="wire" d="M380 95 V125"/>
  <rect x="367" y="125" width="26" height="55" class="res"/>
  <text x="310" y="155" class="lbl">R1</text>
  <text x="310" y="172" class="val">56 kΩ</text>

  <path class="wire" d="M380 180 V250 M380 250 V310"/>
  <circle cx="380" cy="250" r="5" class="node"/>

  <rect x="367" y="310" width="26" height="55" class="res"/>
  <text x="310" y="340" class="lbl">R2</text>
  <text x="310" y="357" class="val">12 kΩ</text>
  <path class="wire" d="M380 365 V465"/>

  <!-- RC -->
  <path class="wire" d="M520 95 V125"/>
  <rect x="507" y="125" width="26" height="55" class="res"/>
  <text x="545" y="155" class="lbl">RC</text>
  <text x="545" y="172" class="val">2.7 kΩ</text>
  <path class="wire" d="M520 180 V205"/>
  <circle cx="520" cy="205" r="5" class="node"/>

  <!-- Transistor Q1 NPN -->
  <circle cx="480" cy="250" r="45" class="trans-circle"/>
  <path class="trans-line" d="M460 228 V272"/>
  <path class="wire" d="M380 250 H460"/>
  <path class="trans-line" d="M460 238 L520 205"/>
  <path class="trans-line" d="M460 262 L520 295"/>
  <polygon points="505,290 520,295 515,280" class="trans-arrow"/>

  <text x="430" y="308" class="lbl">Q1 · 2N3904</text>

  <!-- Rama de Emisor Dividida RE1 (sin bypass) y RE2 (con bypass) -->
  <!-- RE1 -->
  <path class="wire" d="M520 295 V315"/>
  <rect x="507" y="315" width="26" height="45" class="res" style="stroke:#d97706;stroke-width:2.8;"/>
  <text x="455" y="340" class="lbl" style="color:#d97706;">RE1</text>
  <text x="450" y="357" class="val" style="font-weight:bold;">150 Ω</text>
  <text x="545" y="342" class="val" style="font-size:11px;fill:#d97706;">(sin bypass)</text>

  <!-- Nodo intermedio de emisor -->
  <path class="wire" d="M520 360 V385 M520 385 H630"/>
  <circle cx="520" cy="385" r="5" class="node"/>

  <!-- RE2 -->
  <rect x="507" y="385" width="26" height="55" class="res"/>
  <text x="455" y="415" class="lbl">RE2</text>
  <text x="450" y="432" class="val">1.0 kΩ</text>
  <path class="wire" d="M520 440 V465"/>

  <!-- Bypass CE en paralelo SOLO con RE2 -->
  <path class="wire" d="M630 385 V410 M630 430 V465 H520"/>
  <path class="cap" d="M612 410 H648 M612 430 H648"/>
  <text x="658" y="420" class="lbl">CE</text>
  <text x="658" y="437" class="val">47 µF</text>

  <!-- Entrada -->
  <path class="cap" d="M255 232 V268 M270 232 V268"/>
  <text x="245" y="222" class="lbl">C1</text>
  <text x="240" y="284" class="val">10 µF</text>
  <path class="wire" d="M190 250 H255 M270 250 H380"/>
  <circle cx="180" cy="250" r="5" fill="#fff" stroke="#0b69a3" stroke-width="2.5"/>
  <text x="135" y="255" class="lbl">vi (in)</text>

  <!-- Salida con C2 y RL -->
  <path class="wire" d="M520 205 H680"/>
  <path class="cap" d="M680 187 V223 M695 187 V223"/>
  <text x="675" y="177" class="lbl">C2</text>
  <text x="675" y="238" class="val">10 µF</text>

  <path class="wire" d="M695 205 H780"/>
  <circle cx="780" cy="205" r="5" class="node"/>
  <path class="wire" d="M780 205 H830"/>
  <circle cx="830" cy="205" r="5" fill="#fff" stroke="#0b69a3" stroke-width="2.5"/>
  <text x="842" y="210" class="lbl">vo (out)</text>

  <path class="wire" d="M780 205 V275"/>
  <rect x="767" y="275" width="26" height="55" class="res"/>
  <text x="805" y="305" class="lbl">RL</text>
  <text x="805" y="322" class="val">6.8 kΩ</text>
  <path class="wire" d="M780 330 V465"/>

  <!-- Tierra -->
  <path class="wire" d="M380 465 H780"/>
  <path class="wire" d="M520 465 V485"/>
  <path class="gnd" d="M500 485 H540 M508 492 H532 M516 499 H524"/>
</svg>
